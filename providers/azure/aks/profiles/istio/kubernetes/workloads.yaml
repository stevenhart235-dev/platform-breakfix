apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-source
  namespace: platform-breakfix-istio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-source
  template:
    metadata:
      labels:
        app: mesh-source
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 25m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-destination
  namespace: platform-breakfix-istio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-destination
  template:
    metadata:
      labels:
        app: mesh-destination
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-destination
  namespace: platform-breakfix-istio
spec:
  selector:
    app: mesh-destination
  ports:
    - name: http
      port: 80
      targetPort: http
