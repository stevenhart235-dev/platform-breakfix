apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-health-dashboard
  namespace: platform-breakfix-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-health-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-health-dashboard
    spec:
      serviceAccountName: lab-health-dashboard
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: platform-breakfix-dashboard:m14
          imagePullPolicy: Never
          env:
            - name: LAB_HEALTH_PROFILE
              value: minimal
            - name: DASHBOARD_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
