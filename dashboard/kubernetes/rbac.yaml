apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-breakfix-lab-health-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "persistentvolumeclaims", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-breakfix-lab-health-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-breakfix-lab-health-reader
subjects:
  - kind: ServiceAccount
    name: lab-health-dashboard
    namespace: platform-breakfix-dashboard
