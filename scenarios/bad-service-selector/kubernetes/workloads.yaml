apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-source
  namespace: platform-breakfix-scenario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scenario-source
  template:
    metadata:
      labels:
        app: scenario-source
    spec:
      containers:
        - name: source
          image: curlimages/curl:8.12.1
          command: ["sh", "-c", "sleep 3600"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -x /usr/bin/curl || test -x /usr/local/bin/curl"]
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-destination
  namespace: platform-breakfix-scenario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scenario-destination
  template:
    metadata:
      labels:
        app: scenario-destination
    spec:
      containers:
        - name: destination
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: scenario-destination
  namespace: platform-breakfix-scenario
spec:
  type: ClusterIP
  selector:
    app: scenario-destination
  ports:
    - name: http
      port: 80
      targetPort: http
